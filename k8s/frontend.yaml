
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-frontend
  template:
    metadata:
      labels:
        app: laravel-frontend
    spec:
      containers:
        - name: laravel-frontend
          image: laravel-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: laravel-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

